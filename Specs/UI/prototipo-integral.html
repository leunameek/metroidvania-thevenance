<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El asedio de Bacatá · mapa de interfaces</title>
<style>
@font-face{font-family:NotoSerif;src:url('../../Assets/Nemequene/UI/Fonts/NotoSerif-Regular.ttf') format('truetype')}
@font-face{font-family:NotoSans;src:url('../../Assets/Nemequene/UI/Fonts/NotoSans-Regular.ttf') format('truetype')}
:root{--obs:#16130f;--earth:#241b14;--cacao:#312219;--clay:#473225;--coal:#0e0c09;--gold:#b88a47;--sun:#d0a45b;--bone:#e8d8b8;--paper:#cbb894;--ash:#84796a;--moss:#596147;--success:#667653;--ochre:#c28a3e;--danger:#9b463a}
*{box-sizing:border-box}body{margin:0;background:#100d0a;color:var(--bone);font-family:NotoSerif,Georgia,serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}.shell{min-height:100vh;display:grid;grid-template-columns:282px minmax(0,1fr)}aside{background:var(--earth);border-right:2px solid var(--gold);padding:24px 18px;max-height:100vh;overflow:auto}.brand{font-size:23px;line-height:1.1;color:var(--sun);margin:0 0 8px}.hint{font:13px/1.45 NotoSans,sans-serif;color:var(--paper);margin:0 0 24px}.group{font:11px NotoSans,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--sun);margin:22px 8px 9px}.screen-link{display:block;width:100%;border:1px solid transparent;background:transparent;color:var(--paper);text-align:left;padding:10px 12px;margin:3px 0;font-size:15px}.screen-link:hover,.screen-link[aria-current=true]{background:var(--cacao);border-color:var(--gold);color:var(--bone)}.screen-link[aria-current=true]::before{content:'';display:inline-block;width:7px;height:7px;background:var(--sun);transform:rotate(45deg);margin-right:12px}.screen-link.future{color:var(--ash)}.screen-link.future::after{content:'DISEÑO';font:9px NotoSans,sans-serif;letter-spacing:.08em;float:right;margin-top:4px;color:var(--sun)}main{padding:24px clamp(16px,3vw,52px);display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}.topline{display:flex;justify-content:space-between;align-items:end;gap:20px}.topline h1{font-size:clamp(20px,2vw,32px);font-weight:400;margin:0}.topline p{font:13px NotoSans,sans-serif;color:var(--paper);margin:0}.preview{width:100%;max-width:1440px;aspect-ratio:16/9;position:relative;overflow:hidden;background:var(--obs);border:3px solid var(--coal);outline:1px solid var(--gold);box-shadow:0 24px 50px #0009;container-type:inline-size}.game{position:absolute;inset:0;background:linear-gradient(90deg,#16130fbd,#16130f30),url('Evidence/exploration.png') center/cover;color:var(--bone);font-size:1.6cqw;overflow:hidden}.game.title{background:linear-gradient(90deg,#0e0c09b8,#0e0c0920),url('../../Assets/Nemequene/UI/Resources/Nemequene/Menu_BacataDawn-v2.png') center/cover}.shade{position:absolute;inset:0;background:#16130f91}.header{font-size:4.1cqw;color:var(--bone);line-height:1.15;font-weight:400;margin:0 0 2.6cqw}.subhead{font-size:2.3cqw;color:var(--sun);margin:0 0 2cqw}.copy{font-size:1.65cqw;line-height:1.45;color:var(--paper)}.small{font-size:1.3cqw;color:var(--paper);line-height:1.35}.label{font:1.15cqw NotoSans,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}.panel{background:#312219ee;border:2px solid var(--coal);outline:1px solid var(--gold);box-shadow:0 1cqw 3cqw #0007;padding:3.3cqw}.panel.full{position:absolute;inset:4.5% 5%;padding:3.2cqw}.panel.left{position:absolute;left:5%;top:7%;width:45%;max-height:86%;overflow:auto}.panel.right{position:absolute;right:5%;top:9%;width:33%;max-height:82%;overflow:auto}.panel.center{position:absolute;left:22%;top:18%;width:56%;max-height:72%;overflow:auto}.stack{display:flex;flex-direction:column;gap:1.25cqw}.row{display:flex;gap:1.4cqw;align-items:stretch}.row>*{flex:1}.plate{width:100%;min-height:5.4cqw;padding:1.1cqw 2cqw;background:var(--cacao);border:1px solid var(--gold);box-shadow:inset 0 0 0 2px var(--coal);color:var(--bone);text-align:left;font-size:1.9cqw;position:relative}.plate::before{content:'';display:inline-block;width:.6cqw;height:.6cqw;background:var(--gold);transform:rotate(45deg);margin-right:1.4cqw;vertical-align:middle}.plate:hover,.plate:focus-visible,.plate.active{background:var(--sun);color:var(--obs)}.plate:hover::before,.plate:focus-visible::before,.plate.active::before{background:var(--obs)}.plate.secondary{background:var(--earth);border-color:var(--ash)}.plate.danger{border-color:var(--danger)}.plate:disabled{opacity:.55;cursor:default}.rule{height:1px;background:var(--gold);margin:2cqw 0}.artifact{padding:1.6cqw;background:var(--earth);border:1px solid var(--gold);min-height:10cqw}.artifact strong{font-size:1.8cqw;display:block;margin-bottom:.6cqw}.status{font:1.2cqw NotoSans,sans-serif;color:var(--paper);text-transform:uppercase;letter-spacing:.08em}.bar{height:1.35cqw;background:var(--coal);border:1px solid var(--gold);margin:.7cqw 0}.bar span{display:block;height:100%;background:var(--gold)}.emblem{position:absolute;left:27%;top:1%;width:46%;height:49%;object-fit:contain}.home-actions{position:absolute;left:18%;right:18%;bottom:8%;display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw}.home-actions .plate{min-height:6.7cqw;text-align:center;background:#312219e9}.home-actions .plate::before{position:absolute;left:1.8cqw;top:50%}.home-actions .plate:disabled{background:#241b14cc}.floating{position:absolute;bottom:7%;left:31%;width:38%;padding:1.6cqw 2cqw;background:#16130fe8;border:1px solid var(--gold);text-align:center}.hud-top{position:absolute;top:5%;left:5%;width:29%;background:#16130fd9;padding:1.4cqw;border:1px solid var(--gold)}.hud-prompt{position:absolute;bottom:7%;right:5%;background:#312219ee;border:1px solid var(--gold);padding:1.3cqw 2cqw}.tabcol{width:24%;display:flex;flex-direction:column;gap:.8cqw}.tabcol .plate{font-size:1.45cqw;min-height:4.4cqw}.reading{width:72%;overflow:auto}.settings-row{display:flex;justify-content:space-between;gap:1cqw;padding:1.05cqw 0;border-bottom:1px solid #b88a474f;font-size:1.45cqw}.settings-row b{color:var(--sun);font-weight:400}.caption{margin:0;color:var(--paper);font:13px/1.5 NotoSans,sans-serif;max-width:105ch}.caption strong{color:var(--sun);font-weight:500}.meter{height:1.6cqw;border:1px solid var(--gold);background:var(--coal);position:relative}.meter span{display:block;background:var(--success);height:100%;width:38%}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{max-height:none;display:flex;overflow-x:auto;gap:4px;padding:12px}.brand,.hint,.group{display:none}.screen-link{white-space:nowrap;width:auto;margin:0;font-size:13px}main{padding:20px 10px}.topline{display:block}.topline p{margin-top:6px}.caption{font-size:12px}}
@media(max-width:850px){.shell{grid-template-rows:64px 1fr}aside{height:64px;align-items:center}.screen-link{height:40px;flex:0 0 auto}main{justify-content:start}}
</style>
<link rel="stylesheet" href="atlas-v2.css">
</head>
<body>
<div class="shell"><aside id="nav"><h2 class="brand">EL ASEDIO<br>DE BACATÁ</h2><p class="hint">Atlas navegable de interfaces y estados. Las escenas futuras están marcadas como diseño.</p></aside><main><div class="topline"><h1 id="screenName"></h1><p id="screenType"></p></div><div class="preview"><div id="game" class="game"></div></div><p class="caption" id="caption"></p></main></div>
<script>
const nav=document.getElementById('nav');
const groups=[['Recorrido','inicio','ranuras','carga','exploracion','tutorial','pausa','partidas','confirmacion'],['Consulta','diario','mapa','inventario','archivo','ajustes','voz'],['Situaciones','inspeccion','combate','dialogo','derrota','victoria','creditos'],['Extensión','jefe','sigilo']];
const info={inicio:['Inicio','Implementado','Emblema, paisaje y acciones principales. Continuar se activa al existir una partida válida.'],ranuras:['Nueva partida / cargar','Implementado','Tres ranuras con progreso, tiempo y fecha. Reemplazo y eliminación requieren confirmación.'],carga:['Carga','Implementado','La interacción se bloquea durante la carga; un fallo ofrece recuperación.'],exploracion:['Exploración','Implementado','HUD contextual: el mundo mantiene el protagonismo.'],tutorial:['Tutorial contextual','Implementado','Tarjeta de pergamino al comenzar: se descarta con Entendido o tras moverse; también se oculta al abrir otra pantalla.'],pausa:['Pausa','Implementado','La escena queda visible y oscurecida; Continuar conserva el estado.'],partidas:['Partidas guardadas','Implementado','Guardar, cargar y eliminar desde el juego; carga y destrucción protegidas.'],confirmacion:['Confirmación','Implementado','Cancelar recibe el foco inicial y la acción destructiva mantiene una etiqueta explícita.'],diario:['Diario y objetivos','Implementado','Mapa, recorrido y archivo comparten navegación.'],mapa:['Mapa descubierto','Implementado','Solo muestra rutas y elementos conocidos.'],inventario:['Inventario de hallazgos','Implementado','Las piezas completadas se conservan como registros reales; no se simulan consumibles.'],archivo:['Archivo cultural','Implementado','Distingue interpretación artística de evidencia histórica.'],ajustes:['Configuración','Implementado','Los controles existentes se aplican y persisten; remapeo completo es una extensión.'],voz:['Voz y dispositivos','Implementado','Micrófono opcional con alternativa por botón.'],inspeccion:['Inspección','Implementado','El objeto permanece en escena; el panel instruye según mouse o manos.'],combate:['Duelo','Implementado','Turno, señal y acciones válidas sin castigar fallos técnicos de voz.'],dialogo:['Diálogo y subtítulos','Componente listo','El controlador funciona; la secuencia narrativa final requiere contenido autorizado.'],derrota:['Derrota','Implementado','Recuperación clara mediante reintento o menú.'],victoria:['Visita completada','Implementado','Resultado del tramo y salida.'],creditos:['Créditos','Implementado','Autoría y aclaración de interpretación.'],jefe:['Jefe','Diseño para futura mecánica','Jerarquía de nombre y barra de jefe definida; no hay encuentro de jefe en este slice.'],sigilo:['Sigilo','Diseño para futura mecánica','Estados escritos Oculto, Sospecha y Detectado; no hay sistema de sigilo aún.']};
const btn=(label,to,kind='')=>`<button class="plate ${kind}" ${to?`data-go="${to}"`:''}>${label}</button>`;
const panel=(title,body,cls='left')=>`<div class="shade"></div><section class="panel ${cls}"><h2 class="header">${title}</h2>${body}</section>`;
const rows=(entries)=>entries.map(([a,b])=>`<div class="settings-row"><span>${a}</span><b>${b}</b></div>`).join('');
const views={
inicio:()=>`<img class="emblem" alt="El asedio de Bacatá" src="../../Assets/Nemequene/UI/Resources/Nemequene/Title_BacataMountains.png"><div class="home-actions">${btn('Nueva partida','ranuras')}${btn('Configuración','ajustes')}${btn('Continuar','carga')}${btn('Créditos','creditos')}${btn('Cargar partida','ranuras')}${btn('Salir','confirmacion','danger')}</div>`,
ranuras:()=>panel('Partidas guardadas',`<div class="stack"><div class="artifact"><strong>Ranura 1 · Plaza Núñez</strong><span class="status">50 % · 00:42 jugados · 29/09/2026 15:20</span></div><div class="artifact"><strong>Ranura 2 · Vacía</strong><span class="status">Disponible para nueva partida</span></div><div class="artifact"><strong>Ranura 3 · No se puede leer</strong><span class="status">Elimina esta ranura para volver a usarla</span></div><div class="row">${btn('Cargar','carga')}${btn('Nueva partida','carga')}</div>${btn('Volver','inicio','secondary')}</div>`,'center'),
carga:()=>panel('Plaza Núñez',`<p class="copy">Preparando tu llegada a la plaza…</p><div class="bar"><span style="width:62%"></span></div><p class="small">Las manos y la voz son opcionales. Puedes completar el recorrido con mouse y teclado.</p>`,'center'),
exploracion:()=>`<div class="hud-top"><span class="label">OBJETIVO ACTUAL</span><div class="copy">Examina las estaciones de la plaza</div></div><div class="hud-prompt">[ E ] &nbsp; EXAMINAR</div>`,
tutorial:()=>`<div class="hud-top"><span class="label">PLAZA NÚÑEZ</span><div class="copy">Comienza tu recorrido</div></div><section class="parchment tutorial-paper"><h2 class="header">Tutorial</h2><p class="copy">Muévete con WASD. H abre la ayuda.</p>${btn('Entendido','exploracion')}</section>`,
pausa:()=>panel('Pausa',`<div class="stack">${btn('Continuar','exploracion','active')}${btn('Diario','diario')}${btn('Inventario','inventario')}${btn('Guardar partida','partidas')}${btn('Partidas guardadas','partidas')}${btn('Configuración','ajustes')}${btn('Volver al menú principal','inicio','secondary')}</div>`),
partidas:()=>panel('Partidas guardadas',`<p class="small">Al cargar, reapareces en Plaza Núñez con tus lecciones y el duelo completados.</p><div class="artifact"><strong>Ranura 1 · Plaza Núñez</strong><span class="status">50 % · 00:42 · 29/09/2026</span><div class="row" style="margin-top:1cqw">${btn('Guardar',null)}${btn('Cargar','carga')}${btn('Eliminar',null,'danger')}</div></div><div class="artifact"><strong>Ranura 2 · Vacía</strong><div class="row" style="margin-top:1cqw">${btn('Guardar',null)}${btn('Cargar',null,'secondary')}</div></div>${btn('Volver','pausa','secondary')}`,'center'),
confirmacion:()=>panel('Salir del juego',`<p class="copy">¿Quieres cerrar El asedio de Bacatá? Guarda antes de salir para conservar los cambios de esta visita.</p><div class="stack">${btn('Cancelar','inicio','active')}${btn('Salir del juego',null,'danger')}</div>`,'center'),
diario:()=>panel('Diario',`<div class="row"><nav class="tabcol">${btn('Mapa','mapa')}${btn('Recorrido','diario','active')}${btn('Archivo','archivo')}</nav><div class="reading"><span class="label">OBJETIVO ACTIVO</span><h3 class="subhead">Abrir los umbrales</h3><p class="copy">Examina las tres piezas y supera el duelo de entrenamiento. Cada práctica puede completarse en el orden que prefieras.</p><div class="rule"></div><div class="settings-row"><span>Piezas examinadas</span><b>2 / 3</b></div><div class="settings-row"><span>Entrenamiento</span><b>Pendiente</b></div></div></div>${btn('Volver','pausa','secondary')}`,'full'),
mapa:()=>panel('Mapa',`<div class="row"><nav class="tabcol">${btn('Mapa','mapa','active')}${btn('Recorrido','diario')}${btn('Archivo','archivo')}</nav><div class="reading"><span class="label">PLAZA NÚÑEZ · TRAZOS DESCUBIERTOS</span><div class="map-paper"><svg viewBox="0 0 700 300" role="img" aria-label="Ruta descubierta y posición del jugador"><path class="route" d="M72 240 Q155 220 188 176 T320 152 Q425 178 454 105 T625 73"/><circle class="marker" cx="188" cy="176" r="12"/><circle class="marker" cx="454" cy="105" r="12"/><circle class="player" cx="320" cy="152" r="15"/></svg></div><p class="small">Círculo claro: tu posición · Terracota: lugar conocido</p></div></div>${btn('Volver','pausa','secondary')}`,'full'),
inventario:()=>panel('Inventario',`<p class="small">Las piezas examinadas se conservan como hallazgos de esta partida.</p><div class="row"><div class="inventory-grid"><div class="artifact"><svg viewBox="0 0 80 80"><path d="M31 8h18v15l14 8-4 35-11 7H32l-11-7-4-35 14-8zM24 52h32"/></svg><span>Vasija del eco ×1</span></div><div class="artifact"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="25"/><circle cx="40" cy="40" r="9"/><path d="M40 1v9M40 70v9M1 40h9M70 40h9"/></svg><span>Disco del alba ×1</span></div><div class="artifact locked"><svg viewBox="0 0 80 80"><path d="M40 10 66 40 40 70 14 40z"/></svg><span>Por descubrir</span></div>${Array(6).fill('<div class="artifact locked"><svg viewBox="0 0 80 80"><path d="M40 10 66 40 40 70 14 40z"/></svg><span>Bloqueado</span></div>').join('')}</div><div class="inventory-detail"><svg class="glyph" viewBox="0 0 80 80"><path d="M31 8h18v15l14 8-4 35-11 7H32l-11-7-4-35 14-8zM24 52h32"/></svg><h3 class="subhead">Vasija del eco</h3><p class="copy">Interpretación artística. Sigue las líneas que rodean la vasija.</p><p class="small">Hallazgo registrado · ×1</p></div></div>${btn('Volver','pausa','secondary')}`,'full'),
archivo:()=>panel('Archivo cultural',`<div class="row"><nav class="tabcol">${btn('Mapa','mapa')}${btn('Recorrido','diario')}${btn('Archivo','archivo','active')}</nav><div class="reading"><h3 class="subhead">Vasija del eco</h3><p class="copy">Interpretación artística: sigue las líneas que rodean la vasija.</p><div class="rule"></div><h3 class="subhead">Disco del alba</h3><p class="copy">Interpretación artística: observa su relieve desde otro ángulo.</p></div></div>${btn('Volver','pausa','secondary')}`,'full'),
ajustes:()=>panel('Configuración',`<div class="row"><nav class="tabcol">${btn('Accesibilidad',null,'active')}${btn('Audio',null)}${btn('Vídeo',null)}${btn('Controles',null)}${btn('Jugabilidad',null)}${btn('Voz','voz')}</nav><div class="reading"><h3 class="subhead">Accesibilidad</h3>${rows([['Tamaño de texto','125 %'],['Tipografía de alta legibilidad','Desactivada'],['Alto contraste','Desactivado'],['Movimiento reducido','Activado'],['Subtítulos','Activados'],['Fondo de subtítulos','90 %'],['Alternativa a voz','Botones disponibles']])}</div></div>${btn('Volver','pausa','secondary')}`,'full'),
voz:()=>panel('Micrófono y voz',`<p class="copy">La voz es opcional. Todas las acciones del duelo pueden elegirse mediante botones.</p><div class="settings-row"><span>Entrada</span><b>Micrófono predeterminado</b></div><div class="settings-row"><span>Estado</span><b>ESCUCHANDO</b></div><p class="small">Nivel detectado</p><div class="meter"><span></span></div><div class="row" style="margin-top:2cqw">${btn('Iniciar prueba',null)}${btn('Usar botones','combate','secondary')}</div>${btn('Volver','ajustes','secondary')}`,'center'),
inspeccion:()=>panel('Vasija del eco',`<span class="label">LECCIÓN DE GIRO</span><p class="copy">Arrastra con clic izquierdo hacia los lados. Suelta el botón para detener el giro.</p><p class="small">Progreso · 67 %</p><div class="bar"><span style="width:67%"></span></div>${btn('Volver a la plaza','exploracion','secondary')}`,'right'),
combate:()=>`<div class="hud-top"><span class="label">GUARDIÁN DE ENTRENAMIENTO</span><div class="bar"><span style="width:64%"></span></div><p class="small">Resistencia 64 % · Tu vida 90 / 100</p></div><div class="floating"><span class="label">REACCIÓN</span><h2 class="subhead">¡AHORA!</h2><p class="small">Elige una defensa</p><div class="row">${btn('Esquivar',null)}${btn('Bloquear',null)}</div></div>`,
dialogo:()=>`<div class="parchment dialogue-paper"><span class="label">VOZ DE LA PLAZA</span><p class="copy">El camino hacia Bacatá está abierto.</p><div class="row">${btn('Continuar','exploracion')}${btn('Esperar','pausa','secondary')}</div></div>`,
derrota:()=>panel('Has caído',`<p class="copy">Puedes repetir el recorrido desde el punto seguro de Plaza Núñez.</p><div class="stack">${btn('Reintentar','carga')}${btn('Volver al menú','inicio','secondary')}</div>`,'center'),
victoria:()=>panel('Visita completada',`<span class="label">PLAZA NÚÑEZ</span><p class="copy">Tres piezas examinadas y entrenamiento superado. Los dos umbrales están disponibles.</p><div class="stack">${btn('Continuar','exploracion')}${btn('Volver al menú','inicio','secondary')}</div>`,'center'),
creditos:()=>panel('Créditos',`<p class="copy">El asedio de Bacatá · vertical slice.</p><p class="small">Los objetos de práctica y los motivos de la interfaz son interpretaciones artísticas; no constituyen reproducciones arqueológicas.</p>${btn('Volver','inicio','secondary')}`,'center'),
jefe:()=>`<div class="shade"></div><div class="floating" style="top:6%;bottom:auto;left:18%;width:64%"><span class="label">ENCUENTRO</span><h2 class="header">Nombre del jefe</h2><p class="small">Descriptor narrativo autorizado</p><div class="bar"><span style="width:72%"></span></div><span class="status">Resistencia 72 %</span></div>`,
sigilo:()=>`<div class="hud-top" style="top:auto;bottom:6%;width:26%"><span class="label">VIGILANCIA</span><h2 class="subhead">Sospecha</h2><div class="bar"><span style="width:45%;background:var(--ochre)"></span></div><p class="small">Aléjate de la línea de visión.</p></div>`
};
let current='inicio';
function show(id){if(!views[id])return;current=id;const [name,type,caption]=info[id];document.getElementById('screenName').textContent=name;document.getElementById('screenType').textContent=type;document.getElementById('caption').innerHTML='<strong>'+type+'.</strong> '+caption;const game=document.getElementById('game');game.className='game'+(id==='inicio'?' title':'');game.innerHTML=views[id]();document.querySelectorAll('.screen-link').forEach(b=>b.setAttribute('aria-current',b.dataset.go===id));history.replaceState(null,'','#'+id)}
for(const group of groups){const heading=document.createElement('div');heading.className='group';heading.textContent=group[0];nav.appendChild(heading);for(const id of group.slice(1)){const b=document.createElement('button');b.className='screen-link'+(info[id][1].startsWith('Diseño')?' future':'');b.dataset.go=id;b.textContent=info[id][0];nav.appendChild(b)}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-go]');if(target)show(target.dataset.go)});document.addEventListener('keydown',e=>{if(e.key==='Escape')show(current==='inicio'?'inicio':'pausa')});show(views[location.hash.slice(1)]?location.hash.slice(1):'inicio');
</script>
</body>
</html>
